# Documentation du Dagobah Data Lab — site Hugo (thème Hextra).
#
#   make docs         -> génère le site statique dans ../docs (publié par GitHub Pages)
#   make docs-view    -> sert docs/ comme GitHub Pages : http://localhost:8000/dagobah-data-lab/
#   make docs-serve   -> prévisualisation avec rechargement : http://localhost:1313/dagobah-data-lab/
#
# Publication : GitHub Pages (branche main, dossier /docs), sous le sous-chemin
# /dagobah-data-lab/. Les chemins générés sont absolus (/dagobah-data-lab/…) :
# le site doit être servi par HTTP (pas d'ouverture directe en file://).
baseURL: https://laurentpoirierfr.github.io/dagobah-data-lab/
title: Dagobah Data Lab
locale: fr-fr
defaultContentLanguage: fr
enableRobotsTXT: false

# Site généré dans ./docs à la racine du projet.
publishDir: ../docs
cleanDestinationDir: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Installation
      pageRef: /docs/installation
      weight: 1
    - name: Guides
      pageRef: /docs/guides
      weight: 2
    - name: Recherche
      weight: 3
      params:
        type: search
    - name: Thème
      weight: 4
      params:
        type: theme-toggle

params:
  description: Plateforme de données temps réel auto-hébergée sur Kubernetes — journal d'installation.
  navbar:
    displayTitle: true
    displayLogo: false
    width: wide
  page:
    width: wide
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  editURL:
    enable: false
  highlight:
    copy:
      enable: true
      display: hover
