# Documentation du Dagobah Data Lab — site Hugo (thème Hextra).
#
#   make docs         -> génère le site statique dans ../docs
#   make docs-serve   -> serveur de prévisualisation http://localhost:1313
baseURL: /
title: Dagobah Data Lab
locale: fr-fr
defaultContentLanguage: fr
enableRobotsTXT: false

# Site généré dans ./docs à la racine du projet.
publishDir: ../docs
cleanDestinationDir: true

# Consultable aussi SANS serveur (ouverture de docs/index.html en file://) :
# chemins relatifs pour CSS, JS et liens. Après génération, scripts/file-links.py
# ajoute « index.html » aux liens internes vers un dossier (make docs).
relativeURLs: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Installation
      pageRef: /docs/installation
      weight: 1
    - name: Guides
      pageRef: /docs/guides
      weight: 2
    - name: Recherche
      weight: 3
      params:
        type: search
    - name: Thème
      weight: 4
      params:
        type: theme-toggle

params:
  description: Plateforme de données temps réel auto-hébergée sur Kubernetes — journal d'installation.
  navbar:
    displayTitle: true
    displayLogo: false
    width: wide
  page:
    width: wide
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  editURL:
    enable: false
  highlight:
    copy:
      enable: true
      display: hover
